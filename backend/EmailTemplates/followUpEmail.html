<!DOCTYPE 
html>
<html>
<head>
  <meta charset="UTF-8" />
</head>

<body
  style="
    margin:0;
    padding:0;
    background:#f1f5f9;
    font-family:Arial,sans-serif;
  "
>
  <table
    width="100%"
    cellpadding="0"
    cellspacing="0"
    style="padding:40px 0;"
  >
    <tr>
      <td align="center">

        <table
          width="600"
          cellpadding="0"
          cellspacing="0"
          style="
            background:#ffffff;
            border-radius:16px;
            overflow:hidden;
            box-shadow:0 8px 30px rgba(0,0,0,0.08);
          "
        >

          <!-- Header -->
          <tr>
            <td
              style="
                background:#10a774;
                padding:24px;
                color:white;
                font-size:24px;
                font-weight:bold;
              "
            >
              Follow-up Reminder
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px; color:#0f172a;">

              <p style="margin-top:0; font-size:16px;">
                Hello,
              </p>

              <p
                style="
                  font-size:15px;
                  line-height:1.7;
                  color:#334155;
                "
              >
                This is a reminder that your scheduled follow-up for
                <strong>{{lead_name}}</strong>
                is due at
                <strong>{{followup_time}}</strong>.
              </p>

              <table
                width="100%"
                cellpadding="0"
                cellspacing="0"
                style="
                  margin-top:24px;
                  background:#f8fafc;
                  border:1px solid #e2e8f0;
                  border-radius:12px;
                "
              >
                <tr>
                  <td style="padding:20px;">

                    <p style="margin:0 0 10px 0;">
                      <strong>Lead:</strong>
                      {{lead_name}}
                    </p>

                    <p style="margin:0 0 10px 0;">
                      <strong>Follow-up Time:</strong>
                      {{followup_time}}
                    </p>

                    <p style="margin:0;">
                      <strong>Status:</strong>
                      Pending
                    </p>

                  </td>
                </tr>
              </table>

              <!-- CTA -->
              <table
                cellpadding="0"
                cellspacing="0"
                style="margin-top:32px;"
              >
                <tr>
                  <td
                    align="center"
                    bgcolor="#10a774"
                    style="
                      border-radius:10px;
                    "
                  >
                    <a
                      href="{{lead_link}}"
                      style="
                        display:inline-block;
                        padding:14px 24px;
                        color:#ffffff;
                        text-decoration:none;
                        font-weight:600;
                        font-size:14px;
                      "
                    >
                      Open Lead
                    </a>
                  </td>
                </tr>
              </table>

              <p
                style="
                  margin-top:40px;
                  font-size:13px;
                  color:#64748b;
                "
              >
                This is an automated reminder from your CRM system.
              </p>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
